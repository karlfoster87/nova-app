<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05080F">
  <title>Sign in · Nova</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="login-body">
  <main class="login frame">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 27.7 9.3v13.4L16 29.5 4.3 22.7V9.3Z"/><circle cx="16" cy="16" r="6.5"/><circle cx="16" cy="16" r="2.2"/></svg>
    <h1>Nova</h1>
    <p class="brand-tag">Agent console</p>
    <form id="loginForm">
      <label>Profile <input name="name" autocomplete="username" autocapitalize="none" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="error" role="alert"></p>
      <button class="send-btn" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
